<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="robots" content="noindex, nofollow">
<title>Touch Assist · Liquid Glass</title>
<style>
  :root { --text: #f4f6fb; --muted: rgba(235,240,255,.62); --green: #30d158; --blue: #64d2ff; --red: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.4 -apple-system, "SF Pro Display", system-ui, "Segoe UI", sans-serif;
    color: var(--text); background: #05070d; overflow-x: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  [hidden] { display: none !important; }

  /* ---------- nền động ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .85; animation: float 16s ease-in-out infinite alternate; }
  .o1 { width: 62vmax; height: 62vmax; left: -18vmax; top: -16vmax; background: radial-gradient(circle at 30% 30%, #5b6bff, transparent 65%); }
  .o2 { width: 55vmax; height: 55vmax; right: -20vmax; top: 18vh; background: radial-gradient(circle at 60% 40%, #ff4fa3, transparent 65%); animation-duration: 20s; animation-delay: -6s; }
  .o3 { width: 58vmax; height: 58vmax; left: 10vw; bottom: -24vmax; background: radial-gradient(circle at 50% 50%, #19d3c5, transparent 65%); animation-duration: 24s; animation-delay: -12s; }
  @keyframes float {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(8vmax, 6vmax) scale(1.12); }
    100% { transform: translate(-6vmax, 10vmax) scale(.95); }
  }

  /* ---------- kính lỏng ---------- */
  .glass {
    position: relative; overflow: hidden; border-radius: 28px;
    background: linear-gradient(140deg, rgba(255,255,255,.24), rgba(255,255,255,.07) 55%, rgba(255,255,255,.14));
    -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%);
    border: 1px solid rgba(255,255,255,.26);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.1),
                inset 0 0 22px rgba(255,255,255,.06), 0 18px 50px rgba(0,0,0,.38);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background: radial-gradient(120% 70% at 18% -10%, rgba(255,255,255,.42), transparent 55%);
    animation: sheen 9s ease-in-out infinite alternate;
  }
  @keyframes sheen { from { transform: translateX(-8%); opacity: .35; } to { transform: translateX(8%); opacity: .65; } }
  .glass > * { position: relative; }

  main { width: 100%; max-width: 480px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 14px; }
  body.onehand main { margin-top: 28vh; }
  .card { padding: 18px; animation: rise .7s cubic-bezier(.2,.9,.25,1) both; }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  .card:nth-child(4) { animation-delay: .24s; } .card:nth-child(5) { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }

  h1 { font-size: 26px; margin: 4px 2px 0; letter-spacing: -.4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; font-size: 13px;
          background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
  .dot.off { background: #ffb340; box-shadow: 0 0 10px #ffb340; }
  .dot.bad { background: var(--red); box-shadow: 0 0 10px var(--red); }
  @keyframes pulse { 50% { opacity: .45; transform: scale(.8); } }

  /* ---------- đồng hồ đo ---------- */
  .gauge { display: grid; place-items: center; position: relative; }
  .gauge svg { width: 100%; max-width: 300px; overflow: visible; }
  .g-track { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 14; stroke-linecap: round; }
  .g-fill { fill: none; stroke: url(#gg); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 251.33; stroke-dashoffset: 251.33;
            transition: stroke-dashoffset 1.2s cubic-bezier(.2,.9,.25,1); filter: drop-shadow(0 0 8px rgba(100,210,255,.7)); }
  .g-read { position: absolute; bottom: 4px; text-align: center; }
  .g-read b { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .g-read small { display: block; color: var(--muted); margin-top: -2px; font-size: 13px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 18px; padding: 10px 12px; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { font-size: 15px; font-weight: 600; word-break: break-word; }

  /* ---------- nút bật/tắt ---------- */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; }
  .row + .row { border-top: 1px solid rgba(255,255,255,.12); }
  .row .t b { display: block; font-weight: 600; font-size: 16px; }
  .row .t small { color: var(--muted); font-size: 13px; }
  .sw { position: relative; flex: none; width: 56px; height: 34px; padding: 0; border: 0; border-radius: 99px; cursor: pointer;
        background: rgba(120,120,128,.42); box-shadow: inset 0 1px 4px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12);
        transition: background .35s, box-shadow .35s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 99px;
        background: linear-gradient(#fff, #e6ebf5); box-shadow: 0 3px 9px rgba(0,0,0,.4), inset 0 -2px 3px rgba(0,0,0,.08);
        transition: transform .5s cubic-bezier(.34,1.56,.64,1), width .25s cubic-bezier(.34,1.56,.64,1); }
  .sw:active::after { width: 36px; }
  .sw[aria-checked="true"] { background: var(--green); box-shadow: inset 0 1px 4px rgba(0,0,0,.25), 0 0 18px rgba(48,209,88,.45); }
  .sw[aria-checked="true"]::after { transform: translateX(22px); }
  .sw[aria-checked="true"]:active::after { transform: translateX(14px); }

  /* ---------- thanh kéo ---------- */
  .sl { padding: 10px 0; }
  .sl + .sl { border-top: 1px solid rgba(255,255,255,.12); }
  .sl .h { display: flex; justify-content: space-between; align-items: baseline; }
  .sl .h b { font-weight: 600; }
  .sl .h output { font-variant-numeric: tabular-nums; color: var(--blue); font-weight: 600; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 4px 0 0; background: transparent; cursor: pointer; --p: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 99px;
    background: linear-gradient(90deg, #64d2ff var(--p), rgba(255,255,255,.2) var(--p)); box-shadow: inset 0 1px 3px rgba(0,0,0,.35); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 26px; margin-top: -8px; border-radius: 99px;
    background: linear-gradient(#fff, #dfe6f4); box-shadow: 0 4px 12px rgba(0,0,0,.45), inset 0 -2px 3px rgba(0,0,0,.08);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.18, 1.1); }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: rgba(255,255,255,.2); }
  input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: #64d2ff; }
  input[type=range]::-moz-range-thumb { width: 34px; height: 26px; border: 0; border-radius: 99px; background: linear-gradient(#fff, #dfe6f4); box-shadow: 0 4px 12px rgba(0,0,0,.45); }

  /* ---------- vùng thử cảm ứng ---------- */
  .pad { height: 150px; border-radius: 22px; touch-action: none; user-select: none; display: grid; place-items: center; color: var(--muted);
         background: rgba(0,0,0,.18); border: 1px dashed rgba(255,255,255,.3); overflow: hidden; position: relative; }
  .ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%) scale(.2);
            background: radial-gradient(circle, rgba(255,255,255,.75), rgba(100,210,255,.35) 55%, transparent 70%);
            animation: ripple 600ms ease-out forwards; }
  @keyframes ripple { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }

  /* ---------- nút ---------- */
  button.btn { font: inherit; font-weight: 600; color: #fff; cursor: pointer; padding: 13px 18px; border-radius: 99px;
    background: linear-gradient(180deg, rgba(100,160,255,.95), rgba(60,110,240,.95)); border: 1px solid rgba(255,255,255,.4);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), 0 8px 24px rgba(40,90,240,.45); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  button.btn:active { transform: scale(.94); }
  button.btn.ghost { background: rgba(255,255,255,.14); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.35); }
  button.btn:disabled { opacity: .55; }
  .btns { display: flex; gap: 10px; }
  .btns .btn { flex: 1; }

  /* ---------- màn hình khoá ---------- */
  #lock { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px;
          background: rgba(5,7,13,.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #lock .glass { width: 100%; max-width: 380px; padding: 26px 22px; text-align: center; animation: rise .7s cubic-bezier(.2,.9,.25,1) both; }
  #lock h1 { margin: 0 0 4px; }
  #lock p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  #key { width: 100%; font: inherit; font-size: 17px; text-align: center; text-transform: uppercase; letter-spacing: 1.5px; color: #fff;
         padding: 14px; border-radius: 18px; outline: none; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.25); }
  #key:focus { border-color: rgba(100,210,255,.8); box-shadow: 0 0 0 4px rgba(100,210,255,.2); }
  #lock .btn { width: 100%; margin-top: 12px; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 14px; color: var(--red); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<!-- ===== Khoá bằng key ===== -->
<div id="lock">
  <div class="glass" id="lockCard">
    <h1>Nhập key</h1>
    <p>Cần key hợp lệ để mở bảng điều khiển.</p>
    <input id="key" placeholder="PREM-XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="btn" id="go">Mở khoá</button>
    <div id="msg"></div>
  </div>
</div>

<!-- ===== Bảng điều khiển ===== -->
<main id="app" hidden>
  <div class="top">
    <h1>Touch Assist</h1>
    <span class="pill"><i class="dot" id="dot"></i><span id="conn">Đang kết nối</span></span>
  </div>

  <section class="glass card">
    <h2>Trạng thái</h2>
    <div class="gauge">
      <svg viewBox="0 0 200 112" aria-hidden="true">
        <defs>
          <linearGradient id="gg" x1="0" x2="1">
            <stop offset="0" stop-color="#ff6b6b"/><stop offset=".5" stop-color="#ffd60a"/><stop offset="1" stop-color="#30d158"/>
          </linearGradient>
        </defs>
        <path class="g-track" d="M20 100 A80 80 0 0 1 180 100"/>
        <path class="g-fill" id="gfill" d="M20 100 A80 80 0 0 1 180 100"/>
      </svg>
      <div class="g-read"><b id="ms">--</b><small id="gl">Độ trễ máy chủ (ms)</small></div>
    </div>
    <div class="stats">
      <div class="stat"><span>Gói</span><b id="sTier">—</b></div>
      <div class="stat"><span>Thời hạn</span><b id="sLeft">—</b></div>
      <div class="stat"><span>Thiết bị</span><b id="sDev">—</b></div>
      <div class="stat"><span>Key</span><b id="sKey">—</b></div>
    </div>
  </section>

  <section class="glass card">
    <h2>Hỗ trợ cảm ứng</h2>
    <div id="toggles"></div>
  </section>

  <section class="glass card">
    <h2>Tinh chỉnh</h2>
    <div id="sliders"></div>
  </section>

  <section class="glass card">
    <h2>Thử cảm ứng</h2>
    <div class="pad" id="pad">Chạm hoặc kéo ở đây</div>
  </section>

  <div class="btns">
    <button class="btn ghost" id="reset">Đặt lại</button>
    <button class="btn ghost" id="logout">Đăng xuất key</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return e;
  }

  // ---------- lưu trữ ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  function getHwid() {
    let id = store.get('hwid');
    if (!id) {
      const a = new Uint8Array(16);
      crypto.getRandomValues(a);
      id = 'web-' + Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
      store.set('hwid', id);
    }
    return id;
  }
  const HWID = getHwid();

  // ---------- cài đặt ----------
  const TOGGLES = [
    ['smooth', 'Làm mượt cảm ứng', 'Giảm giật khi kéo ngón tay', true],
    ['palm', 'Chống chạm nhầm', 'Bỏ qua vùng chạm quá lớn', true],
    ['boost', 'Tăng độ nhạy', 'Phản ứng với cử chỉ nhẹ hơn', false],
    ['haptic', 'Phản hồi rung', 'Rung nhẹ khi bật/tắt (nếu máy hỗ trợ)', true],
    ['lowlat', 'Giảm độ trễ', 'Ưu tiên phản hồi nhanh', false],
    ['onehand', 'Chế độ một tay', 'Hạ giao diện xuống gần tầm ngón cái', false],
  ];
  const SLIDERS = [
    ['sens', 'Độ nhạy cảm ứng', 50],
    ['speed', 'Tốc độ phản hồi', 60],
    ['area', 'Vùng chạm', 40],
    ['smoothv', 'Độ mượt', 55],
  ];

  const defaults = () => ({
    t: Object.fromEntries(TOGGLES.map((x) => [x[0], x[3]])),
    s: Object.fromEntries(SLIDERS.map((x) => [x[0], x[2]])),
  });

  function loadCfg() {
    const d = defaults();
    try {
      const j = JSON.parse(store.get('cfg') || '{}');
      for (const k of Object.keys(d.t)) if (typeof (j.t || {})[k] === 'boolean') d.t[k] = j.t[k];
      for (const k of Object.keys(d.s)) {
        const v = Number((j.s || {})[k]);
        if (Number.isFinite(v) && v >= 0 && v <= 100) d.s[k] = v;
      }
    } catch (e) { /* ignore */ }
    return d;
  }
  let cfg = loadCfg();
  const save = () => store.set('cfg', JSON.stringify(cfg));

  function buildUi() {
    const tg = $('#toggles');
    tg.replaceChildren();
    for (const [id, label, desc] of TOGGLES) {
      const sw = h('button', { class: 'sw', role: 'switch', 'aria-checked': String(cfg.t[id]), 'aria-label': label, onclick: () => {
        cfg.t[id] = !cfg.t[id];
        sw.setAttribute('aria-checked', String(cfg.t[id]));
        save();
        applyCfg();
        if (cfg.t.haptic && navigator.vibrate) navigator.vibrate(8);
      } });
      tg.append(h('div', { class: 'row' }, h('div', { class: 't' }, h('b', {}, label), h('small', {}, desc)), sw));
    }

    const sl = $('#sliders');
    sl.replaceChildren();
    for (const [id, label] of SLIDERS) {
      const out = h('output', {}, cfg.s[id] + '%');
      const input = h('input', { type: 'range', min: 0, max: 100, step: 1, value: cfg.s[id], 'aria-label': label, oninput: (e) => {
        cfg.s[id] = Number(e.target.value);
        out.textContent = cfg.s[id] + '%';
        e.target.style.setProperty('--p', cfg.s[id] + '%');
        save();
      } });
      input.style.setProperty('--p', cfg.s[id] + '%');
      sl.append(h('div', { class: 'sl' }, h('div', { class: 'h' }, h('b', {}, label), out), input));
    }
  }

  function applyCfg() {
    document.body.classList.toggle('onehand', cfg.t.onehand);
  }

  // ---------- vùng thử cảm ứng ----------
  const pad = $('#pad');
  function ripple(e) {
    if (cfg.t.palm && (e.width > 48 || e.height > 48)) return; // chống chạm nhầm
    const r = pad.getBoundingClientRect();
    const size = 40 + cfg.s.area * 1.6 + (cfg.t.boost ? 24 : 0);
    const dur = (cfg.t.lowlat ? 300 : 450) + cfg.s.smoothv * (cfg.t.smooth ? 7 : 2);
    const el = h('span', { class: 'ripple' });
    el.style.cssText = `left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;width:${size}px;height:${size}px;animation-duration:${dur}ms`;
    pad.append(el);
    el.addEventListener('animationend', () => el.remove());
  }
  let lastMove = 0;
  pad.addEventListener('pointerdown', ripple);
  pad.addEventListener('pointermove', (e) => {
    if (e.buttons === 0 && e.pointerType === 'mouse') return;
    const gap = 110 - cfg.s.speed; // tốc độ phản hồi cao => sinh hiệu ứng dày hơn
    const now = performance.now();
    if (now - lastMove < gap) return;
    lastMove = now;
    ripple(e);
  });

  // ---------- gọi server ----------
  let session = null;   // dữ liệu verify gần nhất
  let skew = 0;         // serverTime - Date.now()
  let timer = null;
  let tick = null;
  let netFails = 0;

  async function verify(key) {
    const t0 = performance.now();
    const r = await fetch('/api/verify', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key, hwid: HWID, deviceName: navigator.platform || 'web' }),
    });
    const d = await r.json();
    return { d, ms: Math.round(performance.now() - t0) };
  }

  function setConn(kind, text) {
    $('#dot').className = 'dot' + (kind ? ' ' + kind : '');
    $('#conn').textContent = text;
  }

  function setGauge(ms) {
    const q = Math.min(1, Math.max(0.03, 1 - (ms - 40) / 460)); // 40ms = đầy, 500ms = gần rỗng
    $('#gfill').style.strokeDashoffset = String(251.33 * (1 - q));
    $('#ms').textContent = ms;
    $('#gl').textContent = ms < 120 ? 'Rất tốt · ms' : ms < 300 ? 'Ổn định · ms' : 'Chậm · ms';
  }

  const maskKey = (k) => (k.length > 10 ? k.slice(0, 4) + '••••' + k.slice(-4) : k);

  function leftText() {
    if (!session) return '—';
    if (session.lifetime) return 'Vĩnh viễn';
    const ms = session.expiresAt - (Date.now() + skew);
    if (ms <= 0) return 'Hết hạn';
    const m = Math.floor(ms / 60000);
    const d = Math.floor(m / 1440);
    const hh = Math.floor((m % 1440) / 60);
    if (d >= 1) return `${d} ngày ${hh} giờ`;
    if (hh >= 1) return `${hh} giờ ${m % 60} phút`;
    return `${m} phút ${Math.floor(ms / 1000) % 60} giây`;
  }

  function renderSession() {
    $('#sTier').textContent = String(session.tier).toUpperCase();
    $('#sDev').textContent = session.deviceLock ? `${session.devicesUsed}/${session.maxDevices}` : 'Không giới hạn';
    $('#sKey').textContent = maskKey(session.key);
    $('#sLeft').textContent = leftText();
  }

  function lock(message) {
    clearInterval(timer); clearInterval(tick);
    session = null;
    $('#app').hidden = true;
    $('#lock').hidden = false;
    $('#msg').textContent = message || '';
    if (message) { const c = $('#lockCard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  }

  function unlock(res, key) {
    session = res.d;
    skew = session.serverTime - Date.now();
    store.set('key', key);
    netFails = 0;
    $('#lock').hidden = true;
    $('#app').hidden = false;
    $('#msg').textContent = '';
    setConn('', 'Đã kích hoạt');
    setGauge(res.ms);
    renderSession();

    clearInterval(timer); clearInterval(tick);
    tick = setInterval(() => {
      $('#sLeft').textContent = leftText();
      if (session && !session.lifetime && session.expiresAt <= Date.now() + skew) recheck();
    }, 1000);
    timer = setInterval(recheck, 60000);
  }

  async function recheck() {
    const key = store.get('key');
    if (!key) return lock('');
    try {
      const res = await verify(key);
      if (!res.d.success) { lock(res.d.message || 'Key không còn hiệu lực'); return; }
      session = res.d;
      skew = session.serverTime - Date.now();
      netFails = 0;
      setConn('', 'Đã kích hoạt');
      setGauge(res.ms);
      renderSession();
    } catch (e) {
      netFails++;
      setConn('off', 'Mất kết nối');
    }
  }

  async function submit() {
    const key = $('#key').value.trim().toUpperCase();
    if (!key) { $('#msg').textContent = 'Hãy nhập key.'; return; }
    $('#go').disabled = true;
    $('#msg').textContent = '';
    try {
      const res = await verify(key);
      if (!res.d.success) { lock(res.d.message || res.d.error || 'Key không hợp lệ'); return; }
      unlock(res, key);
    } catch (e) {
      $('#msg').textContent = 'Không kết nối được máy chủ. Thử lại sau.';
    } finally {
      $('#go').disabled = false;
    }
  }

  // ---------- sự kiện ----------
  $('#go').addEventListener('click', submit);
  $('#key').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  $('#logout').addEventListener('click', () => { store.del('key'); $('#key').value = ''; lock(''); });
  $('#reset').addEventListener('click', () => { cfg = defaults(); save(); buildUi(); applyCfg(); });

  // ---------- khởi động ----------
  buildUi();
  applyCfg();
  const saved = store.get('key');
  if (saved) {
    $('#key').value = saved;
    submit();
  }
})();
</script>
</body>
</html>
